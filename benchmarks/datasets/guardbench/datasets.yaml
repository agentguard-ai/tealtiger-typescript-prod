# GuardBench Dataset
# EU JRC GuardBench safety evaluation samples for guardrail assessment.
#
# Categories align with TealTiger's deterministic governance scope where possible.
# Categories requiring ML inference are marked with not_applicable_reason.
#
# Each sample has: id, category, text, label (true = harmful), optional not_applicable_reason

