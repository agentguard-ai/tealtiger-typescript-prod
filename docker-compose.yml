version: '3.8'

services:
  # Production image
  tealtiger-typescript:
    build:
      context: .
      dockerfile: Dockerfile
    image: tealtiger/typescript-sdk:latest
    container_name: tealtiger-typescript
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: node
    stdin_open: true
    tty: true

  # Development image
  tealtiger-typescript-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tealtiger/typescript-sdk:dev
    container_name: tealtiger-typescript-dev
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - .:/app
      - ./workspace:/workspace
      - /app/node_modules
    working_dir: /app
    command: bash
    stdin_open: true
    tty: true

networks:
  default:
    name: tealtiger-network
